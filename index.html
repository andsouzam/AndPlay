<head>

  <!-- Escudo Zero Anúncios (Ad-Shield) -->
  <script>
    (function initZeroAdsShield() {
      // 1. Bloqueia qualquer tentativa de abertura de popups / popunders com trava definitiva
      const blockPopup = function(url) {
        console.warn('[AdShield] Bloqueado popup/popunder externo:', url);
        return null;
      };
      try {
        window.open = blockPopup;
        Object.defineProperty(window, 'open', {
          configurable: false,
          writable: false,
          value: blockPopup
        });
      } catch (e) {
        window.open = blockPopup;
      }

      // 2. Bloqueia cliques em links externos ou com target="_blank"
      document.addEventListener('click', function(e) {
        const a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (a) {
          const href = String(a.href || '').trim().toLowerCase();
          const isSafe = !href || href.startsWith('#') || href.startsWith('javascript:') || href.includes(window.location.hostname);
          if (!isSafe || a.target === '_blank') {
            console.warn('[AdShield] Bloqueado clique em link externo / popup:', href);
            e.preventDefault();
            e.stopPropagation();
          }
        }
      }, true);

      // 3. Bloqueia cliques automáticos disparados por scripts maliciosos de anúncios
      const _origClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        const href = String(this.href || '').toLowerCase();
        const isSafe = !href || href.startsWith('#') || href.startsWith('javascript:') || href.includes(window.location.hostname);
        if (!isSafe) {
          console.warn('[AdShield] Bloqueado clique automático em anúncio:', href);
          return;
        }
        return _origClick.apply(this, arguments);
      };

      // 4. Suprime alertas invasivos gerados por ad networks
      window.alert = function() {};
      window.confirm = function() { return false; };
      window.prompt = function() { return null; };
    })();
  </script>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --card-hover: #2a2a2a;
      --primary: #e50914;
      --primary-hover: #b80710;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #282828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header (Apenas na interface Web padrão) */
    body:not(.tv-mode) > header {
      background: linear-gradient(180deg, rgba(0,0,0,0.96) 0%, rgba(18,18,18,0.98) 100%);
      padding: 14px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      user-select: none;
    }

    /* Tabs (Filmes / Séries) */
    .nav-tabs {
      display: flex;
      background: #202020;
      padding: 4px;
      border-radius: 25px;
      border: 1px solid #333;
    }

    .nav-tab {
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #bbb;
      background: transparent;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
    }

    .nav-tab:hover:not(.active) {
      color: #fff;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 780px;
      justify-content: flex-end;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 380px;
    }

    .search-box input {
      width: 100%;
      background: #222;
      border: 1px solid #383838;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      background: #282828;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.35);
    }

    select {
      background: #222;
      color: #fff;
      border: 1px solid #383838;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      min-width: 200px;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    /* Status Bar */
    .status-bar {
      padding: 12px 30px;
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #161616;
      border-bottom: 1px solid #202020;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reset-btn {
      background: #333;
      border: 1px solid #444;
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Content Grid */
    main {
      padding: 25px 30px 40px;
      flex: 1;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 22px;
    }

    .media-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      border: 1px solid var(--border);
      outline: none;
    }

    .media-card:hover,
    .media-card:focus {
      transform: translateY(-6px) scale(1.04);
      box-shadow: 0 0 22px rgba(255, 193, 7, 0.75), 0 12px 24px rgba(0,0,0,0.85);
      border-color: #ffc107;
      z-index: 10;
    }

    .btn:focus,
    button:focus,
    select:focus,
    input:focus,
    .version-btn:focus,
    .episode-card:focus {
      outline: 2px solid #ffc107 !important;
      box-shadow: 0 0 14px rgba(255, 193, 7, 0.65) !important;
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      padding-top: 150%; /* 2:3 */
      background: #181818;
    }

    .poster-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .poster-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: #777;
    }

    .badge-4k {
      position: absolute;
      top: 8px;
      left: 8px;
      background: linear-gradient(135deg, #e50914 0%, #ff5722 100%);
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .badge-series {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #0288d1;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-versions {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      font-weight: 800;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .badge-leg {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #4a148c;
      color: #fff;
      font-weight: 700;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-live {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #e50914;
      color: #fff;
      font-weight: 900;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(229, 9, 20, 0.8);
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      z-index: 2;
    }

    .badge-live::before {
      content: '';
      width: 7px;
      height: 7px;
      background-color: #fff;
      border-radius: 50%;
      animation: pulse-live 1.5s infinite;
    }

    @keyframes pulse-live {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1); }
    }

    .badge-channel {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #0288d1;
      color: #fff;
      font-weight: 800;
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .badge-upcoming {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(30, 30, 30, 0.9);
      color: #ffc107;
      border: 1px solid rgba(255, 193, 7, 0.4);
      font-weight: 800;
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 4px;
      z-index: 2;
    }

    .match-vs-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #242424 0%, #101010 100%);
      padding: 12px;
      gap: 8px;
    }

    .match-teams-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
    }

    .match-team-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
    }

    .match-vs-tag {
      font-size: 14px;
      font-weight: 900;
      color: #ffc107;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .match-time-pill {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 2px 10px;
      border-radius: 12px;
    }

    .rating-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.82);
      color: #ffc107;
      font-weight: bold;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Load More */
    .load-more-container {
      display: flex;
      justify-content: center;
      padding: 35px 20px;
    }

    .load-more-btn {
      background: #252525;
      color: #fff;
      border: 1px solid #444;
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .load-more-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.94);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #seriesModal {
      z-index: 1500;
    }

    #movieVersionModal {
      z-index: 2000;
    }

    #videoModal {
      z-index: 2500;
    }

    #imdbSearchModal {
      z-index: 3500;
    }

    .version-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 18px;
      background: #202020;
      border: 1px solid #353535;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #fff;
      width: 100%;
    }

    .version-btn:hover {
      background: #2a2a2a;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(229, 9, 20, 0.3);
    }

    .imdb-card {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .imdb-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .imdb-card.selected-saved {
      border-color: #46d369;
      box-shadow: 0 0 12px rgba(70, 211, 105, 0.4);
    }
    .imdb-thumb-container {
      width: 100%;
      aspect-ratio: 2/3;
      background: #111;
      position: relative;
      overflow: hidden;
    }
    .imdb-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .imdb-year-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffc107;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .imdb-card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .imdb-card-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .imdb-card-id {
      font-size: 11px;
      color: #777;
    }

    .imdb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
      padding: 16px 20px;
      overflow-y: auto;
      max-height: 55vh;
    }

    .imdb-search-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: #141414;
      border-bottom: 1px solid #252525;
      align-items: center;
      flex-wrap: wrap;
    }

    .imdb-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(70, 211, 105, 0.15);
      color: #46d369;
      border: 1px solid rgba(70, 211, 105, 0.3);
    }

    .modal-content {
      background: #181818;
      border-radius: 12px;
      max-width: 1100px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.85);
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      border-bottom: 1px solid #282828;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 15px;
    }

    .close-btn {
      background: #282828;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: var(--primary);
    }

    /* Video Player & Lateral Info Sidebar */
    #videoModal .modal-content {
      max-width: 1300px;
      width: 96vw;
    }

    .player-body-wrapper {
      display: flex;
      flex-direction: row;
      position: relative;
      width: 100%;
      height: 68vh;
      min-height: 480px;
      max-height: 740px;
      background: #000;
      overflow: hidden;
    }

    /* Painel Lateral Esquerdo (Ficha Técnica) */
    .player-info-sidebar {
      width: 330px;
      min-width: 330px;
      max-width: 330px;
      height: 100%;
      background: #141414;
      border-right: 1px solid #282828;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 20px;
      transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1), padding 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #383838 transparent;
      z-index: 5;
    }

    .player-info-sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      max-width: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      border-right: none !important;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .player-main-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      background: #000;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .genre-pill {
      background: #222;
      color: #e0e0e0;
      border: 1px solid #353535;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      display: inline-block;
    }

    .close-sidebar-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
      transition: color 0.15s;
    }
    .close-sidebar-btn:hover {
      color: var(--primary);
    }

    /* Responsividade em telas estreitas */
    @media (max-width: 920px) {
      .player-body-wrapper {
        flex-direction: column-reverse;
        height: auto !important;
        min-height: auto !important;
        max-height: none !important;
      }
      .player-info-sidebar {
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: 38vh !important;
        border-right: none !important;
        border-top: 1px solid #282828 !important;
      }
      .player-info-sidebar.collapsed {
        max-height: 0 !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        border-top: none !important;
      }
      .player-main-area {
        width: 100% !important;
        height: auto !important;
      }
      .video-container {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 9;
        min-height: 240px !important;
      }
      video {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 9;
      }
      #embedPlayer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
      }
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      outline: none;
      background: #000;
    }

    #embedPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      border: none;
      background: #000;
    }

    video::cue {
      background-color: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      text-shadow: 0 2px 4px #000;
      line-height: 1.4;
    }

    .modal-footer {
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: #141414;
      border-top: 1px solid #222;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #333;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #444;
    }

    .sync-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sync-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Series Drawer Modal */
    .series-header-info {
      display: flex;
      gap: 25px;
      padding: 22px;
      background: linear-gradient(180deg, #252525 0%, #1a1a1a 100%);
      border-bottom: 1px solid #333;
    }

    .series-poster-thumb {
      width: 140px;
      height: 210px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      border: 1px solid #444;
    }

    .series-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .series-details h2 {
      font-size: 22px;
      color: #fff;
    }

    .series-synopsis {
      font-size: 13px;
      color: #ccc;
      line-height: 1.5;
      max-height: 90px;
      overflow-y: auto;
    }

    .series-meta-row {
      display: flex;
      gap: 15px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .season-bar {
      padding: 12px 22px;
      background: #18181a;
      border-bottom: 1px solid #282830;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .episodes-list {
      padding: 18px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 52vh;
    }

    .episode-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #1e1e24;
      border: 1px solid #2e2e38;
      border-radius: 10px;
      padding: 14px 18px;
      transition: all 0.2s ease;
    }

    .episode-card:hover {
      background: #25252e;
      border-color: #ffc107;
      transform: translateY(-1px);
    }

    .episode-card-main {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
    }

    .episode-thumb {
      width: 120px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      background: #111;
      flex-shrink: 0;
    }

    .episode-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .episode-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .episode-plot {
      font-size: 12px;
      color: #aaa;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .episode-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      width: 100%;
    }

    /* Spinner */
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 15px;
      color: var(--text-muted);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #333;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
