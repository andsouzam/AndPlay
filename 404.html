<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>EPlay</title>
</head>
<body>
  <p>Redirecionando para o EPlay...</p>
  <script>
    (() => {
      const path = window.location.pathname.replace(/\/+$/, '');
      if (path.endsWith('/tvmode')) {
        const base = path.slice(0, -'/tvmode'.length) || '/';
        window.location.replace(base + '/#tvmode');
        return;
      }

      document.body.innerHTML = '<h1>Página não encontrada</h1><p><a href="../">Voltar ao EPlay</a></p>';
    })();
  </script>
</body>
</html>
